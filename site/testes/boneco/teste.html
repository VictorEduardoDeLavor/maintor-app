<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Boneco — prova de semelhança</title>
<style>html,body{margin:0;background:#e3e3e3;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<!-- Página só de teste (fora do build): o boneco em luz de estúdio, nas mesmas vistas e na mesma
     escala da folha de referência, para comparar por sobreposição.
     ?vista=frente|perfil|34|costas|cabeca|cabecaperfil   (recorte igual ao da folha, 2 px por px da folha)
     ?vista=andar|acenar                                   (animação; window.passo(seg) avança o tempo)
     &e=2 (escala em px por px da folha)  &cel=1 (versão do celular)  &d=0|1|2 (nível de detalhe; 2 = prova) -->
<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js'
import { criarBoneco } from '/src/Boneco.js'

const Q = new URLSearchParams(location.search)
const vista = Q.get('vista') || 'frente', ESC = +(Q.get('e') || 2)
// recortes da folha: [x0, x1, linha0, linha1, x do centro do boneco, rotação y]
const CHAO = 520
const V = {
  frente: [240, 530, 15, 530, 375, 0],
  perfil: [960, 1200, 15, 530, 1077, Math.PI / 2],
  34: [620, 870, 15, 530, 748, 0.62],
  costas: [1280, 1560, 15, 530, 1417, Math.PI],
  cabeca: [280, 470, 15, 250, 375, 0],
  cabecaperfil: [965, 1185, 15, 250, 1077, Math.PI / 2],
  andar: [960, 1200, 15, 530, 1077, Math.PI / 2],
  acenar: [220, 530, 15, 530, 375, 0],
}[vista]
const [x0, x1, l0, l1, cx, rot] = V
const W = (x1 - x0) * ESC, Hh = (l1 - l0) * ESC, ALT = 0.8, s = ALT / 492

const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
r.setPixelRatio(1); r.setSize(W, Hh); r.setClearColor(0xe3e3e3)
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap
document.body.appendChild(r.domElement)
const cena = new THREE.Scene()
const pm = new THREE.PMREMGenerator(r); cena.environment = pm.fromScene(new RoomEnvironment(r), 0.03).texture; cena.environmentIntensity = 0.7
cena.add(new THREE.HemisphereLight(0xffffff, 0xc9c2b8, 0.55))
const chave = new THREE.DirectionalLight(0xfff6ea, 1.7); chave.position.set(-1.6, 3.2, 3.4); chave.castShadow = true
chave.shadow.mapSize.set(2048, 2048); Object.assign(chave.shadow.camera, { left: -1, right: 1, top: 1.2, bottom: -0.4, near: 0.5, far: 12 }); chave.shadow.bias = -0.0004; chave.shadow.radius = 6
cena.add(chave)
const contra = new THREE.DirectionalLight(0xffffff, 0.9); contra.position.set(2.4, 1.6, -2.6); cena.add(contra)
const chao = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.16 })); chao.rotation.x = -Math.PI / 2; chao.receiveShadow = true; cena.add(chao)

const b = criarBoneco({ altura: ALT, celular: Q.get('cel') === '1', detalhe: Q.has('d') ? +Q.get('d') : (Q.get('cel') === '1' ? 0 : 2) }); cena.add(b.raiz)
const v = vista === 'andar' ? 0.55 : 0
// a luz acompanha a vista: o boneco gira e a câmera fica parada, então giro as luzes junto com a câmera fixa
const cam = new THREE.OrthographicCamera((x0 - cx) * s, (x1 - cx) * s, (CHAO - l0) * s, (CHAO - l1) * s, 0.1, 50)
cam.position.set(0, 0, 10); cam.lookAt(0, 0, 0)

const tg = new THREE.Vector3(Math.sin(rot), 0, Math.cos(rot))
let tempo = 0
const avanca = (dt) => { tempo += dt; b.atualizar(dt, { v, tangente: tg, t: tempo, camera: vista === 'acenar' ? cam.position : null }); if (v === 0 && vista !== 'acenar') b.raiz.rotation.y = rot }
avanca(1 / 60)
let ant = performance.now(), livre = true
function quadro(agora) { const dt = Math.min(0.05, (agora - ant) / 1000); ant = agora; if (livre) avanca(dt); r.render(cena, cam); requestAnimationFrame(quadro) }
requestAnimationFrame(quadro)
// gravação: o Playwright para o relógio e avança um tempo fixo por chamada
window.passo = (seg) => { livre = false; for (let i = 0; i < Math.round(seg * 60); i++) avanca(1 / 60); r.render(cena, cam) }
window.info = () => { let m = 0, t = 0; b.raiz.traverse((o) => { if (o.isMesh) { m++; t += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3 } }); return { malhas: m, triangulos: Math.round(t) } }
window.pronto = true
</script>
</body>
</html>
